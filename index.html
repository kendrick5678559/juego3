<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Misión Rescate de Alimentos</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

body{
background:linear-gradient(135deg,#4CAF50,#2196F3);
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
}

.container{
background:white;
width:100%;
max-width:900px;
padding:30px;
border-radius:20px;
box-shadow:0 10px 25px rgba(0,0,0,.25);
text-align:center;
}

h1{
color:#2E7D32;
margin-bottom:15px;
}

.stats{
display:flex;
justify-content:space-around;
flex-wrap:wrap;
gap:10px;
margin-bottom:25px;
font-weight:bold;
font-size:18px;
}

.progress-container{
height:20px;
background:#ddd;
border-radius:20px;
overflow:hidden;
margin-bottom:25px;
}

.progress-bar{
height:100%;
width:0%;
background:#43A047;
transition:.5s;
}

#donacion{
font-size:80px;
margin-bottom:10px;
}

#nombreDonacion{
font-size:26px;
margin-bottom:25px;
font-weight:bold;
}

.refugios{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:15px;
margin-bottom:20px;
}

.refugio{
padding:20px;
border-radius:15px;
cursor:pointer;
color:white;
font-size:18px;
transition:.3s;
}

.refugio:hover{
transform:scale(1.05);
}

.infantil{background:#E91E63;}
.esperanza{background:#2196F3;}
.mayores{background:#FF9800;}

#mensaje{
min-height:180px;
padding:15px;
border-radius:10px;
font-size:17px;
line-height:1.6;
}

.correcto{
background:#E8F5E9;
color:#2E7D32;
}

.incorrecto{
background:#FFEBEE;
color:#C62828;
}

button{
padding:12px 25px;
border:none;
border-radius:10px;
background:#4CAF50;
color:white;
font-size:18px;
cursor:pointer;
margin-top:20px;
}

button:hover{
background:#388E3C;
}

.final{
font-size:22px;
line-height:1.8;
}
</style>
</head>
<body>

<div class="container">

<h1>🚚 Misión Rescate de Alimentos</h1>

<div class="stats">
<div>⏰ Tiempo: <span id="tiempo">60</span>s</div>
<div>⭐ Puntos: <span id="puntos">0</span></div>
<div>📦 Entrega: <span id="entregaActual">1</span>/10</div>
</div>

<div class="progress-container">
<div class="progress-bar" id="barra"></div>
</div>

<div id="donacion">🍞</div>
<div id="nombreDonacion"></div>

<div class="refugios" id="zonaRefugios">

<div class="refugio infantil" onclick="responder('Infantil')">
❤️ Refugio Infantil
</div>

<div class="refugio esperanza" onclick="responder('Esperanza')">
🏠 Hogar Esperanza
</div>

<div class="refugio mayores" onclick="responder('Mayores')">
👵 Centro Adultos Mayores
</div>

</div>

<div id="mensaje"></div>

</div>

<script>

let puntos = 0;
let tiempo = 60;
let indice = 0;
let personasAyudadas = 0;
let kgRescatados = 0;
let bloqueado = false;
let pausado = false;

let donaciones = [

{
emoji:"🍼",
nombre:"Fórmula infantil",
destino:"Infantil",
personas:4,
kg:2,
explicacion:"La fórmula infantil es fundamental para la nutrición de bebés y niños pequeños.",
consejo:"Prioriza productos especializados para quienes realmente los necesitan."
},

{
emoji:"🥛",
nombre:"Leche infantil",
destino:"Infantil",
personas:5,
kg:3,
explicacion:"La leche infantil aporta nutrientes esenciales durante el crecimiento.",
consejo:"Verifica siempre la fecha de vencimiento antes de donarla."
},

{
emoji:"🥣",
nombre:"Cereal infantil",
destino:"Infantil",
personas:4,
kg:2,
explicacion:"Es un alimento diseñado para complementar la alimentación de niños.",
consejo:"Los alimentos para bebés deben almacenarse cuidadosamente."
},

{
emoji:"🍞",
nombre:"Pan fresco",
destino:"Esperanza",
personas:8,
kg:3,
explicacion:"El pan fresco puede distribuirse rápidamente entre familias necesitadas.",
consejo:"Donar excedentes frescos evita que terminen en la basura."
},

{
emoji:"🍎",
nombre:"Manzanas frescas",
destino:"Esperanza",
personas:6,
kg:4,
explicacion:"Las frutas aportan vitaminas importantes para las familias.",
consejo:"Las frutas maduras pueden aprovecharse antes de desperdiciarse."
},

{
emoji:"🍌",
nombre:"Bananos maduros",
destino:"Esperanza",
personas:5,
kg:3,
explicacion:"Los bananos maduros aún conservan gran valor nutricional.",
consejo:"La apariencia no siempre determina si un alimento es útil."
},

{
emoji:"🥕",
nombre:"Verduras variadas",
destino:"Esperanza",
personas:7,
kg:5,
explicacion:"Las verduras ayudan a mantener una dieta equilibrada.",
consejo:"Planificar las compras evita desperdicios."
},

{
emoji:"🍐",
nombre:"Peras frescas",
destino:"Esperanza",
personas:6,
kg:3,
explicacion:"Las frutas son alimentos muy demandados en refugios familiares.",
consejo:"Conservar correctamente los alimentos prolonga su vida útil."
},

{
emoji:"🥬",
nombre:"Vegetales frescos",
destino:"Esperanza",
personas:6,
kg:4,
explicacion:"Aportan nutrientes importantes a muchas familias.",
consejo:"Consumir y donar alimentos antes de que se dañen reduce pérdidas."
},

{
emoji:"🧀",
nombre:"Queso fresco",
destino:"Mayores",
personas:5,
kg:2,
explicacion:"Puede complementar comidas nutritivas para adultos mayores.",
consejo:"Refrigera adecuadamente los productos lácteos."
},

{
emoji:"🍲",
nombre:"Sopa preparada",
destino:"Mayores",
personas:7,
kg:4,
explicacion:"Es fácil de consumir para muchas personas mayores.",
consejo:"La comida preparada debe mantenerse en condiciones seguras."
},

{
emoji:"🥔",
nombre:"Puré de papas",
destino:"Mayores",
personas:6,
kg:3,
explicacion:"Su textura suave facilita el consumo.",
consejo:"Aprovecha las sobras para preparar nuevas comidas."
},

{
emoji:"🥣",
nombre:"Alimentos blandos",
destino:"Mayores",
personas:5,
kg:2,
explicacion:"Muchos adultos mayores requieren alimentos fáciles de masticar.",
consejo:"Adaptar los alimentos a las necesidades mejora su aprovechamiento."
},

{
emoji:"🍚",
nombre:"Comida cocida nutritiva",
destino:"Mayores",
personas:8,
kg:5,
explicacion:"Puede beneficiar directamente a personas mayores vulnerables.",
consejo:"Las donaciones preparadas deben entregarse rápidamente."
},

{
emoji:"🥭",
nombre:"Frutas tropicales",
destino:"Esperanza",
personas:7,
kg:4,
explicacion:"Son una excelente fuente de vitaminas para las familias.",
consejo:"Las frutas perfectamente comestibles no deben descartarse por su apariencia."
}

];

donaciones.sort(()=>Math.random()-0.5);
donaciones = donaciones.slice(0,10);

function actualizarBarra(){
let porcentaje = (indice/donaciones.length)*100;
document.getElementById("barra").style.width = porcentaje + "%";
}

function mostrarDonacion(){

let actual = donaciones[indice];

document.getElementById("donacion").innerHTML = actual.emoji;
document.getElementById("nombreDonacion").innerHTML = actual.nombre;
document.getElementById("entregaActual").innerHTML = indice + 1;

actualizarBarra();
}

mostrarDonacion();

function responder(destino){

if(bloqueado) return;

bloqueado = true;

const actual = donaciones[indice];
const mensaje = document.getElementById("mensaje");

if(destino === actual.destino){

puntos++;
personasAyudadas += actual.personas;
kgRescatados += actual.kg;

mensaje.className = "correcto";

mensaje.innerHTML = `
✅ <strong>ENTREGA CORRECTA</strong><br><br>

<strong>¿Por qué?</strong><br>
${actual.explicacion}<br><br>

<strong>Impacto generado:</strong><br>
👥 Ayudaste a ${actual.personas} personas<br>
♻️ Rescataste ${actual.kg} kg de alimentos<br><br>

<strong>Consejo:</strong><br>
${actual.consejo}
`;

}else{

mensaje.className = "incorrecto";

mensaje.innerHTML = `
❌ <strong>ENTREGA INCORRECTA</strong><br><br>

<strong>Destino correcto:</strong>
${actual.destino}<br><br>

<strong>¿Por qué?</strong><br>
${actual.explicacion}<br><br>

<strong>Consejo:</strong><br>
${actual.consejo}
`;

}

document.getElementById("puntos").innerHTML = puntos;

indice++;

setTimeout(()=>{

mensaje.innerHTML = "";
mensaje.className = "";

if(indice >= donaciones.length){
finJuego();
return;
}

mostrarDonacion();
bloqueado = false;

},3500);
}

function finJuego(){

clearInterval(timer);

let mensajeFinal="";

if(puntos>=9){
mensajeFinal="🌟 Excelente. Eres un verdadero héroe contra el desperdicio alimentario.";
}
else if(puntos>=7){
mensajeFinal="👏 Muy buen trabajo ayudando a distribuir alimentos.";
}
else if(puntos>=5){
mensajeFinal="👍 Buen esfuerzo. Sigue aprendiendo sobre donaciones responsables.";
}
else{
mensajeFinal="📚 Cada decisión cuenta. Sigue practicando.";
}

document.querySelector(".container").innerHTML=`
<div class="final">

<h1>🏆 MISIÓN COMPLETADA</h1>

<p><strong>Puntaje:</strong> ${puntos}/10</p>

<p><strong>👥 Personas Ayudadas:</strong> ${personasAyudadas}</p>

<p><strong>♻️ Kg Rescatados:</strong> ${kgRescatados} kg</p>

<br>

<p>${mensajeFinal}</p>

<br>

<p>
🌍 Gracias a tus decisiones evitaste que muchos alimentos terminaran desperdiciados.
</p>

<button onclick="location.reload()">
🔄 Jugar de Nuevo
</button>

</div>
`;
}

const timer = setInterval(()=>{

if(pausado) return;

tiempo--;

const tiempoElemento = document.getElementById("tiempo");

if(tiempoElemento){
tiempoElemento.innerHTML = tiempo;
}

if(tiempo <= 0){
finJuego();
}

},1000);

document.addEventListener("visibilitychange",()=>{
pausado = document.hidden;
});

</script>

</body>
</html>
